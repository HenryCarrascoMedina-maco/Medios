<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>YoutubeMeta</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Tema guardado; la primera vez, el del sistema operativo (ver ThemeService).
    try {
      var t = localStorage.getItem('ym.theme');
      if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
    } catch (e) {}
  </script>
</head>
<body>
  <ym-root></ym-root>
</body>
</html>
